name: OpenCode review

on:
  push:
  schedule:
    - cron: "0 9 * * 1" # Weekly Monday at 09:00 UTC; schedules run from the default branch.

jobs:
  review:
    runs-on: node # Must match a label configured on an available Forgejo runner.
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli
      - name: Add Context7 plugin
        run: opencode plugin add @upstash/context7-opencode
      - name: Review repository security
        run: opencode run --model upstash/context7 "Review this repository for security issues, including known CVEs. Summarize findings and recommend remediations. Do not create issues, publish releases, or modify repository state."
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
