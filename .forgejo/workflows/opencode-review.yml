name: OpenCode review

on:
  push:

jobs:
  review:
    runs-on: node # Must match a label configured on an available Forgejo runner.
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm install --global @opencode/cli
      - run: opencode plugin add @upstash/context7-opencode
      - name: Review security and handle findings
        run: opencode run --model upstash/context7 "Review this repository for security issues, including known CVEs. If you find an issue, create a Forgejo issue and attempt to prepare a hotfix release."
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
